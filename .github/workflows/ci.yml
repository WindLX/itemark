name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and lint
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          log="$RUNNER_TEMP/itemark-cargo-test.log"
          if cargo test --locked >"$log" 2>&1; then
            cat "$log"
          else
            result=$?
            cat "$log"
            {
              echo '### cargo test failure (last 200 lines)'
              echo '```text'
              tail -n 200 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'itemark-cargo-test.log'
          cargo test --locked 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### cargo test failure (last 200 lines)'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```text'
            Get-Content -LiteralPath $log -Tail 200 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          exit $testExit
