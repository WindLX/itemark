[package]
name = "worklog"
version = "0.1.0"
edition = "2024"

[dependencies]
anstyle = "1.0.14"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
