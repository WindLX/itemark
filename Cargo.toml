[package]
name = "itemark"
version = "0.1.1"
edition = "2024"
description = "A local-first work, fact, and terminology tracker backed by editable Markdown records"
license = "MIT"
repository = "https://github.com/WindLX/itemark"
readme = "crates-io/README.md"
keywords = ["cli", "markdown", "tracker", "productivity", "knowledge"]
categories = ["command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "crates-io/README.md",
    "src/**",
    "i18n/**",
    "benches/**",
]

[dependencies]
anstyle = "1.0.14"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "unicode"] }
libc = "0.2.189"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sys-locale = "0.3.2"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "itemark"
harness = false
